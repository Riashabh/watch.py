name: watch-new-grad-jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
      - name: Save state
        run: |
          git config user.name "job-watch"
          git config user.email "job-watch@users.noreply.github.com"
          git add seen.txt
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase && git push)
